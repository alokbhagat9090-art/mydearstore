
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurielle Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: Arial, sans-serif;
      background: #faf7f2; color: #302820;
    }
    .container { max-width: 950px; margin: auto; }
    h1 { color: #8b6745; }
    .panel {
      background: white; padding: 22px; margin: 18px 0;
      border-radius: 12px; box-shadow: 0 2px 12px #0000000d;
    }
    input, textarea, select {
      width: 100%; padding: 12px; margin: 7px 0 14px;
      border: 1px solid #ddd; border-radius: 7px;
      font-size: 15px;
    }
    button {
      padding: 11px 17px; border: 0; border-radius: 7px;
      background: #8b6745; color: white; cursor: pointer;
      margin: 4px;
    }
    button:hover { opacity: .85; }
    button.danger { background: #a33d36; }
    .hidden { display: none; }
    .product {
      display: flex; align-items: center; gap: 15px;
      border-bottom: 1px solid #eee; padding: 14px 0;
    }
    .product img {
      width: 75px; height: 75px; object-fit: cover;
      border-radius: 8px; background: #eee;
    }
    .product-info { flex: 1; min-width: 0; }
    .product-info p { margin: 5px 0; color: #777; }
    .status { font-size: 12px; color: #777; }
    #message { white-space: pre-wrap; margin: 12px 0; }
    label { font-size: 14px; font-weight: bold; }
    @media(max-width:600px) {
      body { padding: 12px; }
      .product { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Aurielle Jewellery</h1>
  <p>Store Admin Panel</p>
  <div id="message"></div>

  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required>
      <label>Password</label>
      <input id="password" type="password" required>
      <button type="submit">Login</button>
    </form>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="panel">
      <button id="logoutButton">Logout</button>
      <h2 id="formTitle">Add New Product</h2>

      <form id="productForm">
        <input id="productId" type="hidden">

        <label>Product Name</label>
        <input id="name" required maxlength="150">

        <label>Category</label>
        <select id="category" required>
          <option value="">Select category</option>
          <option>Necklaces</option>
          <option>Earrings</option>
          <option>Rings</option>
          <option>Bracelets</option>
        </select>

        <label>Price</label>
        <input id="price" type="number" min="0" step="0.01" required>

        <label>Original Price (optional)</label>
        <input id="comparePrice" type="number" min="0" step="0.01">

        <label>Description</label>
        <textarea id="description" rows="4"></textarea>

        <label>Product Tag (optional)</label>
        <input id="tag" placeholder="Bestseller, New Arrival, etc.">

        <label>Product Photo</label>
        <input id="image" type="file" accept="image/*">

        <label>
          <input id="active" type="checkbox" checked
            style="width:auto;margin:0 6px 0 0">
          Active — visible to customers
        </label>
        <br><br>

        <button type="submit" id="saveButton">Save Product</button>
        <button type="button" id="cancelButton" class="hidden">
          Cancel Edit
        </button>
      </form>
    </div>

    <div class="panel">
      <h2>Your Products</h2>
      <button id="refreshButton">Refresh Products</button>
      <div id="productList">Loading products...</div>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://qusgyjjmgputbhznxjxx.supabase.co";
const SUPABASE_KEY = "sb_publishable_vzathC1cV1CYe5PTG2vuvQ_swGZ3LcJ";
const BUCKET = "JEWELLERY";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function message(text, error = false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#b42318" : "#287a45";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

async function checkAdmin() {
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    $("loginPanel").classList.remove("hidden");
    $("adminPanel").classList.add("hidden");
    return false;
  }

  const { data, error } = await db.rpc("is_store_admin");

  if (error || data !== true) {
    await db.auth.signOut();
    message("This account is not authorized as a store admin.", true);
    $("loginPanel").classList.remove("hidden");
    $("adminPanel").classList.add("hidden");
    return false;
  }

  $("loginPanel").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  await loadProducts();
  return true;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  message("Logging in...");

  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  if (error) {
    message(error.message, true);
    return;
  }

  await checkAdmin();
});

$("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  $("adminPanel").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
  message("Logged out.");
});

async function uploadImage(file) {
  if (!file) return null;

  if (!file.type.startsWith("image/")) {
    throw new Error("Please select an image file.");
  }

  if (file.size > 5 * 1024 * 1024) {
    throw new Error("Image must be smaller than 5 MB.");
  }

  const extension = file.name.split(".").pop().toLowerCase();
  const path = `products/${crypto.randomUUID()}.${extension}`;

  const { error } = await db.storage
    .from(BUCKET)
    .upload(path, file, { upsert: false });

  if (error) throw error;

  const { data } = db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  const button = $("saveButton");
  button.disabled = true;
  message("Saving product...");

  try {
    const id = $("productId").value;
    let imageUrl = null;

    if ($("image").files[0]) {
      imageUrl = await uploadImage($("image").files[0]);
    } else if (id) {
      const existing = await db.from("products")
        .select("image_url").eq("id", id).single();

      if (existing.error) throw existing.error;
      imageUrl = existing.data.image_url;
    }

    const product = {
      name: $("name").value.trim(),
      category: $("category").value,
      price: Number($("price").value),
      compare_at_price: $("comparePrice").value
        ? Number($("comparePrice").value) : null,
      description: $("description").value.trim(),
      tag: $("tag").value.trim() || null,
      image_url: imageUrl,
      is_active: $("active").checked
    };

    const result = id
      ? await db.from("products").update(product).eq("id", id)
      : await db.from("products").insert(product);

    if (result.error) throw result.error;

    message(id ? "Product updated successfully!" : "Product added successfully!");
    resetForm();
    await loadProducts();

  } catch (error) {
    message(error.message, true);
  } finally {
    button.disabled = false;
  }
});

function resetForm() {
  $("productForm").reset();
  $("productId").value = "";
  $("active").checked = true;
  $("formTitle").textContent = "Add New Product";
  $("saveButton").textContent = "Save Product";
  $("cancelButton").classList.add("hidden");
}

$("cancelButton").addEventListener("click", resetForm);

async function loadProducts() {
  $("productList").textContent = "Loading products...";

  const { data, error } = await db.from("products")
    .select("*").order("created_at", { ascending: false });

  if (error) {
    $("productList").textContent = error.message;
    return;
  }

  if (!data.length) {
    $("productList").textContent = "No products added yet.";
    return;
  }

  $("productList").innerHTML = data.map(p => `
    <div class="product">
      <img src="${escapeHTML(p.image_url || "")}"
        alt="${escapeHTML(p.name)}">
      <div class="product-info">
        <strong>${escapeHTML(p.name)}</strong>
        <p>${escapeHTML(p.category)} · ₹${Number(p.price).toFixed(2)}</p>
        <span class="status">${p.is_active ? "Active" : "Inactive"}</span>
      </div>
      <button data-edit="${escapeHTML(p.id)}">Edit</button>
      <button class="danger" data-delete="${escapeHTML(p.id)}">
        Delete
      </button>
    </div>
  `).join("");

  $("productList").querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => {
      const product = data.find(p => p.id === button.dataset.edit);
      editProduct(product);
    });
  });

  $("productList").querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", () => {
      deleteProduct(button.dataset.delete);
    });
  });
}

function editProduct(p) {
  $("productId").value = p.id;
  $("name").value = p.name || "";
  $("category").value = p.category || "";
  $("price").value = p.price ?? "";
  $("comparePrice").value = p.compare_at_price ?? "";
  $("description").value = p.description || "";
  $("tag").value = p.tag || "";
  $("active").checked = p.is_active !== false;
  $("image").value = "";

  $("formTitle").textContent = "Edit Product";
  $("saveButton").textContent = "Update Product";
  $("cancelButton").classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) return;

  const { error } = await db.from("products").delete().eq("id", id);

  if (error) {
    message(error.message, true);
    return;
  }

  message("Product deleted successfully.");
  await loadProducts();
}

$("refreshButton").addEventListener("click", loadProducts);

checkAdmin();
</script>
</body>
</html>
